services:
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    image: ai-agent-app:latest
    build:
      context: .
    container_name: ai-agent-backend
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command:
      - uvicorn
      - multi_agent_app.backend.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  streamlit:
    image: ai-agent-app:latest
    build:
      context: .
    container_name: ai-agent-streamlit
    profiles:
      - streamlit
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000/chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command:
      - streamlit
      - run
      - multi_agent_app/frontend/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

  react:
    image: ai-agent-app:latest
    build:
      context: .
    container_name: ai-agent-react
    profiles:
      - react
    working_dir: /multi_agent_app/multi_agent_app/react_frontend
    volumes:
      - ./multi_agent_app/react_frontend:/multi_agent_app/multi_agent_app/react_frontend
      - react_node_modules:/multi_agent_app/multi_agent_app/react_frontend/node_modules
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-agent-prometheus
    volumes:
      - ./prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ai-agent-grafana
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  react_node_modules:
